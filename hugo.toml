baseURL = "https://example.com/"
locale = "en-GB"
title = "Simon Gorbet Photography"
theme = "simon-photo-gallery"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]
enableRobotsTXT = true

[params]
photographer = "Simon Gorbet"
copyright = "All photographs © Simon Gorbet"
description = "An editorial photography portfolio"
transitionDuration = "320ms"
transitionEasing = "cubic-bezier(0.22, 1, 0.36, 1)"

[params.images]
baseURL = "https://r2-media.simongorbet.com"

[params.images.transforms]
enabled = true
baseURL = "https://r2-media.simongorbet.com/cdn-cgi/image"
thumbnail = "width=480,fit=scale-down,quality=82,format=auto"
grid = "width=1200,fit=scale-down,quality=85,format=auto"
detail = "width=2400,fit=scale-down,quality=88,format=auto"

[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.x]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.youtube]
    disable = true
