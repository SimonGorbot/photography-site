<!doctype html>
<html lang="{{ site.Language.Locale }}">
  <head>{{ partial "head.html" . }}</head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
      {{ partial "header.html" . }}
      <main id="main-content">{{ block "main" . }}{{ end }}</main>
      {{ partial "footer.html" . }}
    </div>
    {{ block "overlay" . }}{{ end }}
  </body>
</html>
